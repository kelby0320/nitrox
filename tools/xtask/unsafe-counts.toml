# The `unsafe` blocks and `unsafe fn`s of each kernel module, counted by `cargo xtask check-unsafe`
# as `cargo xtask unsafe-inventory` counts them: a module is `x.rs` and `x/` together, test code
# left out. A count only falls. `--update` lowers or removes entries; a raise is by hand, in the
# commit that adds the `unsafe`, whose message says why (kernel/CLAUDE.md's `unsafe` policy).

