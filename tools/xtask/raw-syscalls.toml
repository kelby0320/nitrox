# The raw syscalls each userspace crate or module makes: a `syscallN(` or a call of one of
# libkern's own wrappers, counted by `cargo xtask check-syscalls`. A count only falls: reach the
# kernel through libos. `--update` lowers or removes entries; a raise is by hand, in a reviewed
# commit of its own that says why. `[agreed]` names the crates the maintainer agreed may stay
# on libkern, each with its reason; their counts are still held here.
[counts]
"userspace/eshell" = 44
"userspace/libheap" = 5
"userspace/test-harness" = 747
"userspace/test-harness/src/bootprobe/refused" = 2

[agreed]
"userspace/eshell" = "the recovery shell, on libkern by choice"
"userspace/libheap" = "the allocator under everything, on libkern by choice"
"userspace/test-harness/src/bootprobe/refused" = "the boot probe's refusals: each call passes what a safe wrapper cannot express, so the call is the test"
