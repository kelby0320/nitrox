[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Nitrox build orchestrator — kernel builds, Limine fetch, disk image, QEMU."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Pure `core`, host-compilable: seed the user DB's PBKDF2 verifiers with the *same*
# KDF the on-target auth-service verifies with (no drift). See `assemble_image`.
libcrypto = { path = "../../userspace/libcrypto" }
# The display gate renders the expected image itself rather than comparing against a
# golden file checked into the repo. `libdraw`'s core is `core + alloc` with no
# dependencies, so the host build is free; the `io` feature (syscalls) stays off.
libdraw = { path = "../../userspace/libdraw" }
# The toolkit, for the same reason: the display gate renders `libui::reference` here and
# compares it against what the guest put on the screen. Its core is `core + alloc` over
# `libdraw` and `librsproto`, so the host build stays free of syscalls.
libui = { path = "../../userspace/libui" }
# The terminal's cell vocabulary and render. Here for two reasons: the display gate will render
# `libterm::reference` the way it renders `libui::reference`, and — before that — this is the
# one place that can see `libterm` and `libui` at once, which is what makes their shared
# background colour checkable rather than merely claimed (PR #189 review, finding 6).
libterm = { path = "../../userspace/libterm" }
# **An external crate, and the first in `tools/`.** The forbidden list is about the *kernel*, and
# `userspace/CLAUDE.md`'s bar is about what ships in the image; this is build tooling that runs on
# the host and reaches no target. What it buys is that a render made here can be *looked at* —
# which is the whole of Part A, and a hand-rolled encoder would be a hundred lines of checksum
# arithmetic standing between a judgement about how something looks and seeing it.
png = "0.18.1"
