[package]
name = "nitrox-kernel"
version = "0.1.0"
edition = "2024"
description = "Nitrox kernel — bare-metal x86_64 entry, Limine-loaded."

[lib]
name = "nitrox_kernel"
path = "src/lib.rs"

[[bin]]
name = "nitrox-kernel"
path = "src/main.rs"

[features]
# Compile in the boot-time self-tests / demos (`src/boot_selftest.rs`) and run them
# during boot. Off by default: a normal boot goes straight to userspace. Enabled by
# `cargo xtask qemu --selftest` (and the future `xtask test-qemu` for CI).
selftest = []
# **Boot with the i8042's interrupt generation left off.** The controller is configured and
# both devices are reset and enabled exactly as normal; only the final `CONFIG_KBD_IRQ |
# CONFIG_AUX_IRQ` write in `arch::ps2::arm` is skipped, so the controller never asserts IRQ 1
# or 12 and the tick-driven `ps2::poll` recovery sweep is the *only* path from a keystroke to
# the guest. Exists so `cargo xtask check-input --no-ps2-irq` can fail when that sweep is
# deleted — no pass count can, because on healthy hardware the interrupt path carries every
# byte and the sweep never runs. Never in a production kernel.
no-ps2-irq = []
# **The framebuffer console's gate hooks**, for `cargo xtask check-fbcon`. Never in a production
# kernel. Two things a working kernel does not do:
#
# - **Panic on an F10 press**, from inside the i8042 driver with its lock held. The console's
#   third promise — a machine that stops takes the screen back — needs a stop *after* the
#   desktop is up, and QEMU's `inject-nmi` arrives through LINT1, which nothing unmasks, under
#   TCG and KVM alike.
# - **Hold the screen still for a second** at two moments: after the timer is calibrated, and at
#   the `/dev/framebuffer` handout. A gate that samples a scrolling console sees a line only if a
#   dump happens to land while it is up, and the last line before the handout is up for as long
#   as the compositor takes to draw — milliseconds (PR #296 review). A held frame is read on
#   every run.
fbcon-gate = []
# **Hold the i8042 drain for 300 ms after an F9 press**, for `cargo xtask check-input`. Nothing is
# read from the controller while the hold is on, so what the host injects meanwhile queues up in
# QEMU's sixteen-byte PS/2 queue — which is how the gate builds, on purpose, the state in which
# QEMU holds a mouse release for want of room and sends it only on the next injected event (the
# `lost-release` cause, 2026-09-23). Exists so the gates' flush has a guard: at the natural rate,
# about two runs in a hundred, deleting it passes everything. Implied by `test-harness`, since
# `check-input` boots that kernel; never in a production kernel.
ps2-hold-gate = []
# Integration-test build (`cargo xtask test-qemu`): everything `selftest` runs,
# plus the `isa-debug-exit` primitive + `SYS_DEBUG_EXIT` gated syscall, and boot
# failures/panics terminate QEMU with a fail verdict instead of dropping to eshell
# or halting. Never in a production kernel. See
# `docs/conventions/qemu-integration-tests.md`.
test-harness = ["selftest", "ps2-hold-gate"]

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1
debug = true
overflow-checks = true

[profile.release]
panic = "abort"
opt-level = 3
debug = true
lto = false
codegen-units = 1
overflow-checks = false
