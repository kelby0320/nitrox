[package]
name = "libterm"
version = "0.1.0"
edition = "2024"

# Terminal semantics, and all of Milestone 5 Part A: the cell vocabulary (A2), the
# escape-sequence parser (A3), the grid with its scrollback (A4), the render (A5) and the key
# encoder (A6). See `docs/planning/display-arm-plan.md`.
#
# **Not in `libdraw`**, which the plan originally said and the M5 planning pass corrected.
# (M11 Part B weakened the premise below without touching the conclusion: `libdraw` does hold
# the desktop's *theme* now, because the compositor needs one and links no toolkit. A table of
# colours is pixel vocabulary; an escape-state machine is not.)
# `libdraw` is the pixel layer — geometry, formats, framebuffers, compositing. An escape-state
# machine, a cell grid, scrollback and line wrapping contain no pixels; putting them there
# would make the pixel layer know what a cursor is. This crate sits above `libdraw` exactly as
# `libui` does, and reaches for it only in the render.
#
# **One crate for both directions of the wire.** The parser turns a program's bytes into grid
# operations; the encoder turns a person's key events back into bytes. They are the two halves
# of one protocol, and keeping them together is what lets a test send `encode(Up)` through
# `tty_server::Discipline` and get `Up` back — two independently-written ends checked against
# each other rather than each against someone's belief about the other. That test found a
# four-year-old shape of bug on its first run: the discipline ended a CSI at its first byte.
[dependencies]
libdraw = { path = "../libdraw" }
# The keymap — keycode + modifiers to a character, control fold included. The encoder adds the
# sequences a keymap cannot express and reimplements none of it.
libinput = { path = "../libinput" }
# `MOD_*`, and the keycode names, which are both type-level.
librsproto = { path = "../librsproto" }
libkern = { path = "../libkern" }
# `ceilf` for cell metrics: `core` has no float transcendentals, and a font's line height is a
# float that has to round *up* or a row of glyphs comes out a pixel short.
libm = { version = "0.2", default-features = false }

# `tty_server::Discipline` parses the input escape sequences this crate produces, so the two
# ends of one wire can be checked against each other. A dev-dependency: nothing links the tty
# server into a terminal, and Part C's direction of travel is the reverse of this one.
[dev-dependencies]
tty-server = { path = "../tty-server" }

[lib]
name = "libterm"
path = "src/lib.rs"
