[package]
name = "libterm"
version = "0.1.0"
edition = "2024"

# Terminal semantics. Built so far: the cell vocabulary (A2) and the escape-sequence parser
# (A3). Still to come in Milestone 5 Part A — see `docs/planning/display-arm-plan.md` — the cell
# grid with its scrollback (A4), the render (A5), and the key encoder (A6).
#
# **Not in `libdraw`**, which the plan originally said and the M5 planning pass corrected.
# `libdraw` is the pixel layer — geometry, formats, framebuffers, compositing. An escape-state
# machine, a cell grid, scrollback and line wrapping contain no pixels; putting them there
# would make the pixel layer know what a cursor is. This crate sits above `libdraw` exactly as
# `libui` does, and reaches for it only in the render.
#
# **One crate for both directions of the wire**, once A6 lands. The parser turns a program's
# bytes into grid operations; the encoder will turn a person's key events back into bytes. They
# are the two halves of one protocol, and keeping them together is what will let a test send
# `encode(Up)` through `tty_server::Discipline` and get `Up` back — two independently-written
# ends checked against each other rather than each against someone's belief about the other.
[dependencies]
libdraw = { path = "../libdraw" }
# `ceilf` for cell metrics: `core` has no float transcendentals, and a font's line height is a
# float that has to round *up* or a row of glyphs comes out a pixel short.
libm = { version = "0.2", default-features = false }

[lib]
name = "libterm"
path = "src/lib.rs"
