[package]
name = "child"
version = "0.1.0"
edition = "2024"

[dependencies]
libkern = { path = "../libkern" }
# The C3 setup-message stage path (`run_stream_stage`): read `stdin` + `argv` from a
# setup message. `libstream[io]` needs an allocator → `libheap`. Conforming to the one
# spawn convention; moves into the test harness when parent/child are retired
# (decision log 2026-07-24).
libheap = { path = "../libheap" }
libstream = { path = "../libstream", features = ["io"] }

[[bin]]
name = "child"
path = "src/main.rs"
