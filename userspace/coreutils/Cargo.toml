[package]
name = "coreutils"
version = "0.1.0"
edition = "2024"

# The Nitrox coreutils — `list`, `copy`, and the rest of design §10c. Each program is
# an ordinary userspace process that speaks **TSM1 on stdio** so it composes in a shell
# pipeline; none of them is a resource server (they are *clients* of one). Naming
# departs from GNU deliberately (`list`, not `ls`) — see the shell design doc §10c; the
# familiar short names are namespace binds, not aliases.
#
# One crate, a bin per program, plus this shared lib: every program needs the same
# Tier-1 stage prologue, the same GNU-style argument parsing, and the same TSM1 stdout
# plumbing, and that shared surface is the point of keeping them together.
[dependencies]
# Calendar arithmetic, which used to be this crate's `time` module and moved below it when
# `desktop-shell` became a second consumer (M11 Part E batch 9).
libtime = { path = "../libtime" }
libkern = { path = "../libkern" }
libheap = { path = "../libheap" }
librsproto = { path = "../librsproto", features = ["io"] }
libfs = { path = "../libfs" }
libstream = { path = "../libstream", features = ["io"] }

[lib]
name = "coreutils"
path = "src/lib.rs"

[[bin]]
name = "list"
path = "src/bin/list.rs"

[[bin]]
name = "copy"
path = "src/bin/copy.rs"

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"

[[bin]]
name = "remove"
path = "src/bin/remove.rs"

[[bin]]
name = "rename"
path = "src/bin/rename.rs"

[[bin]]
name = "move"
path = "src/bin/move.rs"

[[bin]]
name = "touch"
path = "src/bin/touch.rs"

[[bin]]
name = "date"
path = "src/bin/date.rs"

[[bin]]
name = "sleep"
path = "src/bin/sleep.rs"

[[bin]]
name = "whoami"
path = "src/bin/whoami.rs"
