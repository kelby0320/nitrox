[package]
name = "desktop-shell"
version = "0.1.0"
edition = "2024"

# The graphical session's leader, and **the compositor's first real manager**. Everything M6
# built for one — placement, restacking, focus, the initial-configure hold, the five manager
# events — has been exercised by a test client until now.
#
# It draws a top bar, holds `/dev/draw/manage`, and constructs a namespace per application it
# spawns. That last part is the load-bearing one: `ui-composition-model.md` §5a rests the
# guarantee that "an application cannot compose other applications" on the shell being the
# process that built them.
#
# **It does not bind its own endpoint**, which is what reconciles a process that both serves
# and constructs with `syscaps.md` (`graphical-session.md` §3): it holds `BIND_NAMESPACE` to
# construct *application* namespaces continuously, not to register itself once.
#
# The `/dev/desktop` binding that would let an application talk back is
# `TODO(desktop-endpoint)` — deferred until something resolves it.
[dependencies]
# Calendar arithmetic for the clock on the top bar (M11 Part E batch 9). It was
# `coreutils::time` until it had two consumers; see `userspace/CLAUDE.md` on where a helper
# lives once it does.
libtime = { path = "../libtime" }
libkern = { path = "../libkern" }
# `io` for `session::Dir`: the modal reads /bin as a forwarded directory.
librsproto = { path = "../librsproto", features = ["io"] }
libsurface = { path = "../libsurface" }
libui = { path = "../libui" }
libdraw = { path = "../libdraw", features = ["io"] }
libheap = { path = "../libheap" }
# The Tier-1 setup message: the shell receives one and hands a derived one to every
# application it launches, so a program in a window starts the same way a pipeline stage does.
libstream = { path = "../libstream", features = ["io"] }
# Whole-file reads, for the session's theme: the shell opens `/home/theme.toml` once and hands
# every application the result on the environment record it already forwards (M11 Part C).
libfs = { path = "../libfs" }

# The pure half — the desktop-entry parser and the modal's filter — so it can be host-tested.
# Same split as `init`, `service-mgr`, `nxterm`, `nxfiles` and `nxedit`.
[lib]
name = "desktop_shell"
path = "src/lib.rs"

[[bin]]
name = "desktop-shell"
path = "src/main.rs"
