[package]
name = "session-mgr"
version = "0.1.0"
edition = "2024"

[dependencies]
libkern = { path = "../libkern" }
librsproto = { path = "../librsproto" }
libstream = { path = "../libstream", features = ["io"] }
libheap = { path = "../libheap" }
# The shared session core, M7 Part B. This column moves onto it first so the serial login
# proves it before the graphical one depends on it.
libsession = { path = "../libsession" }

# Bin-only, bare-target supervisor. **Not alloc-free** — this comment said so until M7
# Part B and had been wrong since 2026-07-31, when the no-`alloc` rule was lifted so a
# session could be handed its environment; `main.rs` registers `libheap` as the
# `#[global_allocator]` and `CLAUDE.md` records the decision.
#
# What is left here after Part B is the **greeter**: the terminal prompt, the tty plumbing
# and the session loop. Everything from "credentials in hand" to "the leader has exited"
# is `libsession`.
[[bin]]
name = "session-mgr"
path = "src/main.rs"
