[package]
name = "init"
version = "0.1.0"
edition = "2024"

[dependencies]
libkern = { path = "../libkern" }
libheap = { path = "../libheap" }
libos = { path = "../libos" }
# The `init.toml` parser, shared with the storage service (administration Part C.5).
libinittoml = { path = "../libinittoml" }

# The host tests of `ready` build messages with the encoder every server uses. A dev-dependency
# only: init's own build still hand-parses (`userspace/init/CLAUDE.md`).
[dev-dependencies]
librsproto = { path = "../librsproto" }

# A library + binary split: the library holds init's host-testable internals (the
# bump-allocator math now; the `toml_lite` parser in Part 4), the binary is the
# bare-target PID-1 entry point. `cargo xtask test` runs the lib tests on the host
# (`--lib` skips the `#![no_main]` bin); `cargo xtask build` builds the bin bare.
[lib]
name = "init"
path = "src/lib.rs"

[[bin]]
name = "init"
path = "src/main.rs"
