[package]
name = "input-server"
version = "0.1.0"
edition = "2024"

[dependencies]
libkern = { path = "../libkern" }
libheap = { path = "../libheap" }
libos = { path = "../libos" }
librsproto = { path = "../librsproto", features = ["io"] }

# A library + binary split, like `tty-server` and `compositor`: the library holds the
# host-testable merge — the part with all the behaviour and none of the syscalls.
[lib]
name = "input_server"
path = "src/lib.rs"

[[bin]]
name = "input-server"
path = "src/main.rs"
