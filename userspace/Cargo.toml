[workspace]
resolver = "3"
members = ["init","libkern","libheap","libos","libstream","librsproto","libdraw","compositor","libsurface","libui","liblog","libcrypto","libtime","fs-server-ext4","hello","test-harness","eshell","service-mgr","heartbeat","profile-server","logging-service","auth-service","session-mgr","coreutils","libfs","nxfiles","nxedit","nxsh","tty-server","input-server","libinput","libterm","nxterm","libsession","desktop-session-mgr","desktop-shell","clipboard-server"]

# `hello` is a freestanding no_std bin with no unwinder; abort on panic.
# Harmless for the std `init`/`libkern` members (xtask never builds them for
# the bare target).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
