[package]
name = "libui"
version = "0.1.0"
edition = "2024"

# The widget toolkit. `docs/architecture/widget-toolkit.md` is the design; the short version is a
# **retained tree with a declarative face** — an application holds state and writes
# `view(&state) -> Element`, and the runtime diffs that description against the tree it keeps.
#
# The name used to belong to what is now `libsurface`, which is a Surface-protocol client
# rather than a toolkit. This crate is what an application means by "the UI library", and it
# sits above `libsurface` rather than replacing it.
#
# Part A is pure: the tree, layout, the diff, and damage bookkeeping are functions of values,
# with no syscall in any of them, so they host-test in milliseconds. The parts that need a
# window arrive with event routing in Part B.
[dependencies]
libdraw = { path = "../libdraw" }
# For `TextFieldState::apply`: one keycode-to-character mapping, shared with the terminal and
# the compositor, rather than a second one that could disagree with them about a key.
libinput = { path = "../libinput" }
# For the `EV_KEY` codes the text field and list act on — the same set `libterm` imports.
libkern = { path = "../libkern" }
librsproto = { path = "../librsproto" }
#  for the baseline:  has no float transcendentals, and the ascent is a float.
libm = { version = "0.2", default-features = false }

[lib]
name = "libui"
path = "src/lib.rs"
