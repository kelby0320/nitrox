[package]
name = "nxterm"
version = "0.1.0"
edition = "2024"

# The GUI terminal: Milestone 5 Part B of `docs/planning/display-arm-plan.md`.
#
# Split lib/bin like `tty-server` and `compositor`: state, `view` and `update` are functions of
# values and host-test in milliseconds; the window, the shared buffers and the event pump are
# the binary's. That split is what `libui`'s declarative model exists to make possible, and
# this is its first real user.
[dependencies]
libterm = { path = "../libterm" }
libui = { path = "../libui" }
libdraw = { path = "../libdraw", features = ["io"] }
libsurface = { path = "../libsurface" }
librsproto = { path = "../librsproto", features = ["io"] }
# The keymap, for the chord constants' tests only: `COPY_KEYCODE` claims to be `c`, and the
# table is what says so — a comment cannot.
libinput = { path = "../libinput" }
libkern = { path = "../libkern" }
libstream = { path = "../libstream", features = ["io"] }
libheap = { path = "../libheap" }

[lib]
name = "nxterm"
path = "src/lib.rs"

[[bin]]
name = "nxterm"
path = "src/main.rs"

[features]
# Report each completed line of the grid on the debug console, so
# `cargo xtask check-terminal` can assert on **what the terminal shows** rather than on
# pixels — the shell's exact output is not fixed by this milestone, and a pixel comparison
# would pin it. Off in a real build: a terminal that narrated itself to the kernel log would
# undo the point of the tty server owning output.
test-harness = []
