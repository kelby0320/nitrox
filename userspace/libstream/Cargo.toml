[package]
name = "libstream"
version = "0.1.0"
edition = "2024"

# `libstream` — typed structured streams (the TSM1 wire format; see
# `docs/spec/typed-stream-format.md`). The wire core (`wire.rs`) is `core + alloc`
# only, with **no dependencies** — so it stays transport-agnostic and host-tests
# cleanly (`cargo test -p libstream --target <host>`), exactly like `libcrypto`.
[dependencies]
# The concrete channel transport (`IpcPort`) touches syscalls, so it depends on the
# raw syscall layer — but only under the `io` feature, so the wire core keeps
# host-testing with no dependency. Off by default; a userspace bin that moves streams
# over a real IPC channel enables it (`libstream = { …, features = ["io"] }`).
libkern = { path = "../libkern", optional = true }

[features]
# The syscall-backed transport: `channel::IpcPort` over `sys_channel_send`/`recv`.
io = ["dep:libkern"]

[lib]
name = "libstream"
path = "src/lib.rs"
