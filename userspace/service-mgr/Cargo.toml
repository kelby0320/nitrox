[package]
name = "service-mgr"
version = "0.1.0"
edition = "2024"

[dependencies]
libkern = { path = "../libkern" }
libheap = { path = "../libheap" }
# The resource-server protocol: `Meta::Ready` from the servers it starts, and the resolves its
# endpoint answers with `SUBNAMESPACE` into its registry (administration Part E.1).
librsproto = { path = "../librsproto" }
# Whole-file reads of the declarations, sized from the object rather than a guessed mapping.
libfs = { path = "../libfs" }

# A library + binary split (mirroring init): the library holds the host-testable
# internals (the service-declaration parser), the binary is the bare-target
# supervisor entry point. `cargo xtask test` runs `cargo test -p service-mgr --lib`
# (the `#![no_main]` bin can't build on host); `cargo xtask build` builds the bin bare.
[lib]
name = "service_mgr"
path = "src/lib.rs"

[[bin]]
name = "service-mgr"
path = "src/main.rs"
