[package]
name = "nxinstall"
version = "0.1.0"
edition = "2024"

# The installer: Phase 5 Part H.1 of `docs/planning/phase-5-bare-metal.md`.
#
# **A Nitrox program, not an `xtask`** — the open question Part H carried, settled towards
# self-hosting: the system installs itself, from a terminal in the installer session, using
# the same namespace rules as everything else. It holds no authority of its own; it can reach
# a disk only because the session it runs in was given one (`libsession::installer_boot`).
#
# Split lib/bin the way `nxfiles` is, for a different reason: what the bin does is I/O, and
# what the lib does is decide where two partitions go. The second is arithmetic that destroys
# a disk when it is wrong and looks perfect in a boot that succeeds, so it is host-tested.
[dependencies]
# The partition table, written whole and read whole. The lib needs it too — a `Layout`
# becomes `Partition`s — which is why it is not behind a feature.
libgpt = { path = "../libgpt" }
# **The ext4 format library**, which is this crate's other half of the job: `mkfs` lays out a
# filesystem the size of the partition and `create_file`/`mkdir_at`/`grow_file` fill it. The
# crate is named for the server, and its lib is the format — the same lib the server's bin is
# a syscall shim around. Part H.2's plan named these functions, so the dependency is the
# design rather than a shortcut.
fs-server-ext4 = { path = "../fs-server-ext4" }
libkern = { path = "../libkern" }
libheap = { path = "../libheap" }
libstream = { path = "../libstream", features = ["io"] }

[lib]
name = "nxinstall"
path = "src/lib.rs"

[[bin]]
name = "nxinstall"
path = "src/main.rs"
