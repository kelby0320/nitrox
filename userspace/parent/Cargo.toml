[package]
name = "parent"
version = "0.1.0"
edition = "2024"

[dependencies]
libkern = { path = "../libkern" }
libos = { path = "../libos" }
librsproto = { path = "../librsproto" }
# The stdio/pipe transport demo (C3): move a TSM1 stream over a real IPC channel
# between two threads. `libstream[io]` needs an allocator → `libheap`. (This demo is
# convention-conforming; it will move into the test harness when parent/child are
# retired — decision log 2026-07-24.)
libheap = { path = "../libheap" }
libstream = { path = "../libstream", features = ["io"] }

[[bin]]
name = "parent"
path = "src/main.rs"
