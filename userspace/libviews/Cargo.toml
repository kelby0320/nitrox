[package]
name = "libviews"
version = "0.1.0"
edition = "2024"

# `libviews` — the view broker's client: asking the broker to run a program in a view
# (docs/spec/rsproto-views-ops.md), and the channel plumbing that carries it. It was `with`'s own,
# and `coreutils::ipc`, until the desktop's power menu needed to ask too (administration Part
# F.3): a helper with two consumers belongs below both, `userspace/CLAUDE.md`'s rule.
[dependencies]
libkern = { path = "../libkern" }
# The handles a request moves, and the waits.
libos = { path = "../libos" }
# The Views codec: requests, outcomes and listings.
librsproto = { path = "../librsproto" }
# The channel plumbing a password crosses: send, receive and wait, each buffer scrubbed. It moved
# into `libprompt` with the prompts (administration Part G.2), and this crate speaks through it.
libprompt = { path = "../libprompt" }

[dev-dependencies]
libos = { path = "../libos", features = ["mock"] }

[lib]
name = "libviews"
path = "src/lib.rs"
