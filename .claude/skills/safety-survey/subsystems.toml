# The subsystems a safety survey covers. `/safety-survey <name>` hands one entry to the workflow.
# Together they cover every userspace crate and every entry of kernel/src, which the workflow's
# test holds. A path is where the survey starts, not a fence: a reviewer follows the code out of it.
# `id` prefixes the subsystem's items in docs/planning/safety-survey.md, as in `kobj-d3`.

[[subsystem]]
name = "kernel-objects"
id = "kobj"
what = "the syscall boundary, handles and their rights, and the kernel's objects"
paths = [
  "kernel/src/syscall/",
  "kernel/src/object/",
  "kernel/src/handle/",
  "kernel/src/libkern/",
  "kernel/src/rsproto.rs",
  "kernel/src/entropy.rs",
]

[[subsystem]]
name = "kernel-memory"
id = "kmem"
what = "physical and virtual memory, user copies, memory objects and the page cache, TLB shootdown"
paths = [
  "kernel/src/mm/",
  "kernel/src/tlb.rs",
  "kernel/src/arch/paging.rs",
  "kernel/src/arch/user_access.rs",
  "kernel/src/arch/x86_64/paging.rs",
  "kernel/src/arch/x86_64/user_access.rs",
  "kernel/src/arch/x86_64/tlb.rs",
  "kernel/src/object/memory_object.rs",
  "kernel/src/object/file_object.rs",
]

[[subsystem]]
name = "scheduler"
id = "sched"
what = "threads, scheduling across CPUs, waiting, timers, DPCs and locks"
paths = [
