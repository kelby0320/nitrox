name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue tidy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build kernel + host tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Two toolchains, on purpose. The kernel and tools stay on **stable** with the
      # built-in bare target. Userspace pins a **nightly** in
      # `userspace/rust-toolchain.toml` because its hard-float target is a custom spec,
      # and a custom spec has no precompiled sysroot — `-Z build-std` (nightly-only)
      # rebuilds `core`/`alloc` from `rust-src`. rustup picks the right one per
      # directory; the `check-nightly` step below keeps the pin from becoming a licence
      # to use nightly language features. See the decision log, 2026-07-21.
      - name: Install Rust (stable for kernel/tools, pinned nightly for userspace)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-none
          rustup toolchain install "$(grep -oP 'channel\s*=\s*"\K[^"]+' userspace/rust-toolchain.toml)" \
            --profile minimal --component rust-src --no-self-update

      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            tools/target
            userspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'kernel/.cargo/config.toml', 'userspace/rust-toolchain.toml', 'userspace/x86_64-unknown-nitrox.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Enforce the architecture-abstraction boundary: kernel code outside
      # arch/ must not reference arch internals. See
      # docs/conventions/arch-boundary.md.
      - name: cargo xtask check-arch
        run: cargo xtask check-arch

      # The nightly pin in userspace/ exists solely to `-Z build-std` the custom
      # hard-float target. This fails the build if any shipped crate reaches for a
      # nightly language or library feature, keeping the exception narrow.
      - name: cargo xtask check-nightly
        run: cargo xtask check-nightly

      # A `TODO(tag)` in shipping source must have an entry in
      # docs/rationale/deferred-decisions.md. Three deferrals that cost real time to
      # rediscover were each recorded outside that list; this makes the code half
      # mechanical. See the 2026-07-24 audit.
      - name: cargo xtask check-deferrals
        run: cargo xtask check-deferrals

      # Documentation must not point at things that do not exist. The 2026-08-05
      # consistency pass found `docs/architecture/overview.md` — the file the root
      # CLAUDE.md tells you to read first — linking to five documents that had never
      # been written, plus a spec citing a `librsproto` source file that does not
      # exist. A reader who follows a dead reference goes to the source and builds a
      # private model, which is one of the ways the docs and the code came apart.
      - name: cargo xtask check-docs
        run: cargo xtask check-docs

      # The lock-order tracker gives every interrupt handler a fresh scope, because the
      # acquisition order genuinely restarts at an interrupt boundary. A dispatcher that
      # skips the scope does not fail loudly — it reports phantom inversions from its own
      # vector — so this checks every entry stub goes through the macro that opens one.
      # Getting this wrong is what got the tracker withdrawn once (2026-07-29).
      - name: cargo xtask check-irq-scope
        run: cargo xtask check-irq-scope

      # `userspace/libkern` is a hand-maintained mirror of the kernel ABI — syscall
      # numbers, KError/KObjectType discriminants, Rights bits, shared limits — with
      # nothing in the build tying the two sides together. This compares them. Its
      # trigger was "a second non-demo consumer"; there are now six or seven, and two
      # values (SYS_FILE_RENAME, MAX_WAIT_HANDLES) were hand-copied during Slice C.
      - name: cargo xtask abi-sync-check
        run: cargo xtask abi-sync-check

      # Builds the kernel ELF for x86_64-unknown-none.
      - name: cargo xtask build
        run: cargo xtask build

      # Host-side tests: kernel lib (compiled against the host triple via
      # an internal override in xtask) plus the tools workspace.
      #
      # `e2fsprogs` is a real dependency of this step, not a nicety: the ext4
      # mutation tests build an image with `mke2fs` and then require `e2fsck -fn`
      # to find it clean, which is what keeps the write path honest.
      - name: cargo xtask test
        run: cargo xtask test

  integration:
    name: QEMU integration (image + boot self-test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable for kernel/tools, pinned nightly for userspace)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-none
          rustup toolchain install "$(grep -oP 'channel\s*=\s*"\K[^"]+' userspace/rust-toolchain.toml)" \
            --profile minimal --component rust-src --no-self-update

      # The image build needs the GPT/FAT tooling and OVMF firmware.
      #
      # The boot runs under **KVM**, not TCG, and that is a requirement rather than an
      # optimisation: the kernel is x2APIC-only (decision log, 2026-06-26) and QEMU's
      # TCG only emulates x2APIC from 9.0, while ubuntu-latest ships 8.2 — under TCG
      # the guest panics with "CPU lacks x2APIC". KVM's in-kernel APIC has no such
      # limit, and it is also several times faster. `xtask test-qemu --kvm` preflights
      # /dev/kvm and fails with that explanation if it is missing.
      #
      # The udev rule widens /dev/kvm permissions: the runner user is not in the `kvm`
      # group, and a group change would not apply to the already-running shell.
      - name: Install QEMU, OVMF and image tooling
        run: |
          sudo apt-get update
          # `qemu-kvm` is a transitional metapackage and 26.04 dropped it
          # ("has no installation candidate"); `qemu-system-x86` is the real package
          # and provides `-enable-kvm` on both images, so it is the only one needed.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf gdisk mtools e2fsprogs
          qemu-system-x86_64 --version
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm-writable.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Which CPU this run actually got. Kept because runner silicon is luck-of-the-draw
      # and the kernel has already had one vendor-specific bug here: `sysretq` leaves
      # `SS` at RPL 0 on AMD but not Intel, which made this job fail for every run
      # between #120 and its fix (decision log, 2026-07-30) and look deterministic when
      # it was really "whichever pool answered". A red run that does not say which
      # vendor it was on costs a whole round-trip to find out.
      - name: Report environment
        run: |
          echo "=== runner ==="
          uname -a
          qemu-system-x86_64 --version | head -1
          echo "--- CPU ---"
          lscpu | grep -iE "^(Architecture|Vendor ID|Model name|CPU\(s\)|Hypervisor|Virtualization)" || true
          echo "--- baseline-relevant flags (missing ones print nothing) ---"
          for f in smep smap x2apic xsave xsaveopt avx avx2 fsgsbase umip la57 invpcid rdtscp constant_tsc nonstop_tsc hypervisor; do
            grep -qw "$f" /proc/cpuinfo && echo "  have $f" || echo "  MISSING $f"
          done

      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            tools/target
            userspace/target
            tools/build-cache/limine
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'kernel/.cargo/config.toml', 'userspace/rust-toolchain.toml', 'userspace/x86_64-unknown-nitrox.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-
            ${{ runner.os }}-cargo-

      # **The test image and the release image may differ only on a short allow-list.** Builds both
      # initramfs archives and compares them file by file: four of the seven are
      # byte-identical, and the three that are not are the two declaration files plus
      # `sbin/init`, which still carries one `#[cfg(feature = "selftest")]`. A new divergence
      # fails here — wiring `mode.features()` into a build that does not take one, the shape
      # Part B removed from `session-mgr`, makes that program's ELF differ with nothing else in
      # CI to notice. (A bare `#[cfg]` does not: those crates declare no features, so it is inert
      # in both modes.)
      #
      # This is what turns `docs/planning/test-path-retrofit.md`'s result into a wall rather
      # than a number in a doc. It runs in the QEMU job because it needs both images built,
      # not because it boots anything.
      - name: cargo xtask check-images
        run: cargo xtask check-images

      # The whole boot, adjudicated: kernel -> init -> ext4 mount -> userspace demos
      # -> login chain, with the guest writing a verdict to isa-debug-exit and a
      # wall-clock timeout catching a hang. This is the gate that catches what host
      # unit tests structurally cannot — every regression found during coreutils
      # Milestone 1 was caught here, and none of them would have failed the jobs
      # above. See docs/conventions/qemu-integration-tests.md.
      - name: cargo xtask test-qemu --kvm
        run: cargo xtask test-qemu --kvm

      # The **release image**, which nothing else here boots. It used to be the only place
      # a login ran at all: `session-mgr` auto-logged-in under `test-harness` and ran a fixed
      # script, so the `login:` prompt, a typed password, a real shell prompt and `exit` were
      # `#[cfg(not(feature = "test-harness"))]` code this workflow compiled and never
      # executed. Every interactive bug the project has had lived exactly there: a console
      # read with the wrong rights, a `cd` guard refusing a builtin that existed, a login
      # that could not be repeated, a password prompt landing on the username's line.
      #
      # Retrofit Part B (2026-08-21) removed that substitution — `session-mgr` has one
      # `login()` in every build — and moved its login proof here as steps 5a-5c. The gate
      # still boots the only release image any job boots, which matters while `init` keeps
      # its own cfgs (Part C). Expect-driven, so the guest paces it rather than guessed
      # sleeps.
      - name: cargo xtask test-interactive --kvm
        run: cargo xtask test-interactive --kvm

      # The **windowed** path, which neither gate above reaches: a click that raises
      # `nxterm`, keys travelling nxterm -> tty-server -> nxsh and echoing back into the
      # grid, and the shell's answer rendered there. `check-input` stops at the test
      # client's event log and `check-display` never types, so nothing else in CI covers
      # the compositor-to-shell round trip.
      #
      # **Promoted 2026-08-18** on 64 consecutive passes (24 idle, 15 loaded and 5 --kvm
      # from the audit; 24 loaded and 16 instrumented since). One failure remains
      # unexplained, seen once during the audit at the click step under concurrent build
      # load and never reproduced. What changed to make promotion defensible is not the
      # count but that the failure is now legible: the gate asserts *where* the press
      # landed before asserting that `nxterm` received it, so a recurrence in CI reports
      # coordinates instead of a bare timeout. See docs/decision-log.md, 2026-08-18.
      - name: cargo xtask check-terminal --kvm
        run: cargo xtask check-terminal --kvm

      # The fault dump prints raw addresses, and a local rebuild of the same commit
      # does **not** reproduce CI's code layout — symbolizing CI addresses against a
      # local binary yields nonsense. Upload the exact ELF so `addr2line` can resolve
      # the faulting RIP and the return-address candidates from the run that produced
      # them. Failure-only: this is diagnostic weight, not something to carry on green.
      - name: Upload kernel ELF for symbolization
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nitrox-kernel
          path: kernel/target/x86_64-unknown-none/debug/nitrox-kernel
          if-no-files-found: warn
